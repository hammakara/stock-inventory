<div class="bg-white rounded-xl border border-slate-200 overflow-hidden">
  <div class="p-4 border-b border-slate-200 flex items-center justify-between">
    <div>
      <h3 class="font-semibold text-slate-900 text-sm">Suppliers & Vendors</h3>
      <p class="text-xs text-slate-500 mt-0.5">Manage purchasing contacts, lead times, and terms</p>
    </div>
    <button onclick="openSupplierModal()" class="px-3 py-1.5 text-xs font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg flex items-center gap-1.5">
      <i class="fa-solid fa-plus"></i> Add Supplier
    </button>
  </div>

  <div class="overflow-x-auto">
    <table class="w-full text-left text-xs">
      <thead class="bg-slate-50 text-slate-500 uppercase tracking-wider text-[10px] font-semibold border-b border-slate-200">
        <tr>
          <th class="py-3 px-4">Company Name</th>
          <th class="py-3 px-4">Contact Person</th>
          <th class="py-3 px-4">Email</th>
          <th class="py-3 px-4">Phone</th>
          <th class="py-3 px-4 text-center">Lead Time</th>
          <th class="py-3 px-4">Terms</th>
          <th class="py-3 px-4 text-right">Actions</th>
        </tr>
      </thead>
      <tbody id="suppliers-table-body" class="divide-y divide-slate-100">
        <tr>
          <td colspan="7" class="py-8 text-center text-slate-400">Loading suppliers from Google Sheets...</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  function loadSuppliers() {
    if (typeof google === 'undefined' || !google.script) return;
    google.script.run
      .withSuccessHandler(function(suppliers) {
        AppState.suppliers = suppliers;
        var tbody = document.getElementById('suppliers-table-body');
        if (!tbody) return;
        if (!suppliers || suppliers.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" class="py-8 text-center text-slate-400">No suppliers found.</td></tr>';
          return;
        }
        tbody.innerHTML = suppliers.map(function(s) {
          return '<tr class="hover:bg-slate-50/80">' +
            '<td class="py-3 px-4 font-medium text-slate-900">' + s.companyName + '</td>' +
            '<td class="py-3 px-4 text-slate-700">' + (s.contactPerson || '-') + '</td>' +
            '<td class="py-3 px-4 text-slate-500 font-mono">' + (s.email || '-') + '</td>' +
            '<td class="py-3 px-4 text-slate-500">' + (s.phone || '-') + '</td>' +
            '<td class="py-3 px-4 text-center tabular-nums">' + (s.leadTimeDays || 3) + ' days</td>' +
            '<td class="py-3 px-4 text-slate-600">' + (s.paymentTerms || 'Net 30') + '</td>' +
            '<td class="py-3 px-4 text-right space-x-2">' +
              '<button onclick="editSupplier(\'' + s.id + '\')" class="text-blue-600 hover:underline">Edit</button>' +
              '<button onclick="deleteSupplierConfirm(\'' + s.id + '\')" class="text-rose-600 hover:underline">Delete</button>' +
            '</td>' +
          '</tr>';
        }).join('');
      })
      .apiGetSuppliers();
  }
</script>
