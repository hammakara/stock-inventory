<div class="max-w-2xl mx-auto bg-white rounded-xl border border-slate-200 p-6 space-y-5">
  <div>
    <h3 class="font-semibold text-slate-900 text-base">Record Stock Out (Dispatch Order)</h3>
    <p class="text-xs text-slate-500 mt-1">Dispatch goods from warehouse. Strict validation prevents negative stock balances.</p>
  </div>

  <form id="stock-out-form" onsubmit="handleStockOutSubmit(event)" class="space-y-4">
    <div>
      <label class="block text-xs font-medium text-slate-700 mb-1">Select Product *</label>
      <select id="stockout-product-select" required onchange="handleProductSelectForOut(this.value)" class="w-full text-xs p-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:outline-hidden focus:border-blue-500">
        <option value="">-- Choose Product to Dispatch --</option>
      </select>
      <div id="stockout-product-info" class="text-[11px] text-slate-500 mt-1.5 flex items-center justify-between">
        <span>Available On-Hand: <strong id="stockout-available-stock" class="text-blue-600 font-mono">--</strong></span>
        <span>Selling Price: <strong id="stockout-price" class="text-slate-800 font-mono">--</strong></span>
      </div>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-medium text-slate-700 mb-1">Dispatch Quantity *</label>
        <input type="number" id="stockout-quantity" min="1" required class="w-full text-xs p-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:outline-hidden focus:border-blue-500" placeholder="e.g. 5">
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-700 mb-1">Selling Price ($)</label>
        <input type="number" id="stockout-price-input" step="0.01" min="0" class="w-full text-xs p-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:outline-hidden focus:border-blue-500" placeholder="Defaults to catalogue price">
      </div>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-medium text-slate-700 mb-1">Order / Invoice Reference *</label>
        <input type="text" id="stockout-ref" required class="w-full text-xs p-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:outline-hidden focus:border-blue-500" placeholder="e.g. SO-2026-0912">
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-700 mb-1">Customer / Destination</label>
        <input type="text" id="stockout-customer" class="w-full text-xs p-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:outline-hidden focus:border-blue-500" placeholder="Client company name">
      </div>
    </div>

    <div>
      <label class="block text-xs font-medium text-slate-700 mb-1">Dispatch Notes</label>
      <textarea id="stockout-notes" rows="2" class="w-full text-xs p-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:outline-hidden focus:border-blue-500" placeholder="Tracking number, courier, packing slip..."></textarea>
    </div>

    <div class="pt-3 border-t border-slate-100 flex justify-end gap-2">
      <button type="reset" class="px-4 py-2 text-xs font-medium text-slate-600 hover:bg-slate-100 rounded-lg">Reset</button>
      <button type="submit" id="stockout-submit-btn" class="px-5 py-2 text-xs font-medium text-white bg-amber-600 hover:bg-amber-700 rounded-lg flex items-center gap-1.5">
        <i class="fa-solid fa-arrow-up"></i> Confirm Stock Out Dispatch
      </button>
    </div>
  </form>
</div>

<script>
  function handleStockOutSubmit(e) {
    e.preventDefault();
    var productId = document.getElementById('stockout-product-select').value;
    var quantity = Number(document.getElementById('stockout-quantity').value);
    var ref = document.getElementById('stockout-ref').value;
    var customer = document.getElementById('stockout-customer').value;
    var notes = document.getElementById('stockout-notes').value;

    var btn = document.getElementById('stockout-submit-btn');
    btn.disabled = true;
    btn.innerText = 'Validating Stock...';

    google.script.run
      .withSuccessHandler(function(res) {
        showToast('Stock Out completed successfully! Remaining balance: ' + res.newStock, 'success');
        document.getElementById('stock-out-form').reset();
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-arrow-up"></i> Confirm Stock Out Dispatch';
        navigate('products');
      })
      .withFailureHandler(function(err) {
        showToast(err.message, 'error');
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-arrow-up"></i> Confirm Stock Out Dispatch';
      })
      .apiStockOut({
        productId: productId,
        quantity: quantity,
        referenceNumber: ref,
        customerName: customer,
        notes: notes
      });
  }
</script>
